# Configuration Farmland
# ⚠ Ne JAMAIS mettre de vraies URL de webhook ici, ce fichier est dans le repo Git public !
# Remplis les vraies valeurs dans plugins/Farmland/config.yml sur ton serveur, pas ici.

discord:
  webhook-status: ""
  webhook-message: ""
  webhook-moderation: ""

# WebAPI vers farm-land.fr
# Remplis base_url et api_key dans plugins/Farmland/config.yml sur ton serveur
webapi:
  enabled: false
  base_url: ""
  api_key: ""
  # interval du push statut serveur (joueurs en ligne / max / version)
  push_interval_seconds: 30
  # intervalle du push leaderboard (argent, structures, blocs posés)
  leaderboard_push_minutes: 15

# Monde du hub (commande /hub)
hub:
  world: "world"

# Sites de vote affichés par /vote (récompense gérée par NuVotifier)
vote:
  sites:
    - "https://serveur-prive.net/minecraft/farmland"
    - "https://top-serveurs.net/minecraft/farmland"
  # texte de récompense affiché sur la page Vote du site
  reward: "+1h worldedit $FB"

GsonSave: 1
# Annonces aleatoires diffusees toutes les 5 minutes (jeu + Discord)
annonces:
  messages:
    - "Rejoins la course de bateaux avec /joinboat, depuis n'importe ou sur le serveur !"
    - "Suis le marche en direct sur mine.farm-land.fr"
    - "Vote pour le serveur avec /vote et gagne du temps WorldEdit gratuit !"
    - "Le podium quotidien de la course de bateaux rapporte jusqu'a 500 $FB !"
    - "Personnalise ton look avec /buy cosmetic !"
    - "Construis, vends, grimpe dans le classement sur mine.farm-land.fr"

# Marche par offre et demande (prix des jetons du /bag)
# Le marche apprend le volume normal vendu de chaque metier et le prix reagit aux ecarts.
marche:
  # volume normal minimal (jetons/heure) : un metier peu joue reste reactif
  volume-min: 2000
  # l'apprentissage suit la moyenne des ventes sur cette duree (72 = 3 jours)
  apprentissage-heures: 72
  # une heure de ventes compte au plus N fois le volume normal (protection anti-dump)
  plafond-apprentissage: 3
  # echelle du prix = N heures de volume normal (plus grand = marche plus tolerant aux grosses ventes)
  echelle-heures: 24
  # un surplus de jetons fond de moitie toutes les N heures
  demi-vie-heures: 12
  # penurie maximale, en echelles (4 = prix jusqu'a ~ +90 %)
  penurie-max: 4
  # frequence de la demande et de la sauvegarde du marche (bulletin toutes les 30 min)
  intervalle-minutes: 5

# Guide des joueurs
guide:
  # Fond illustré du menu d'accueil (nécessite le resource pack avec glyphes/fond_guide.png).
  # À activer après avoir vérifié l'alignement avec un vrai client.
  fond-illustre: false

# Logs de diagnostic en console (Historique, autosave, hologrammes...) : false par defaut
debug: false

# Journal des evenements de jeu : plugins/Farmland/evenements.log (une ligne : date;type;joueur;valeur)
journal:
  actif: true
  # normal = argent, marche, course, plot ; detail = + meteo du plot et point de spawn
  niveau: normal
  # les evenements frequents (bonus de blocs) sont additionnes sur cette duree
  regroupement-minutes: 5
  # les archives evenements-AAAA-MM-JJ.log plus vieilles sont supprimees
  retention-jours: 30
