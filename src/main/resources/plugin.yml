name: Farmland
main: fr.kevyn.farmland.FarmlandMain
version: 1.0
api-version: 1.21.11
loadbefore: [ FastAsyncWorldEdit, WorldEdit ]
depend: [ PlaceholderAPI, Multiverse-Core ]
softdepend: [ Votifier, NuVotifier ]

commands:

  peche:
    description: permet d'obtenir la canne a péche de farm
    usage: /peche
    permission: farmland.gamecommands

  epee:
    description: permet d'obtenir l'epee de l'Agriculteur
    usage: /epee
    permission: farmland.gamecommands

  hache:
    description: permet d'obtenir la hache du Tueur
    usage: /hache
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  upgradeepee:
    description: ameliore l'Epee (0 a 10, cout croissant)
    usage: /upgradeepee
    permission: farmland.gamecommands

  upgradehache:
    description: ameliore la Hache (0 a 10, cout croissant)
    usage: /upgradehache
    permission: farmland.gamecommands

  upgradepioche:
    description: ameliore les chances de minerai rare (0 a 10, cout croissant)
    usage: /upgradepioche
    permission: farmland.gamecommands

  upgradehoue:
    description: ameliore les chances de recolte multipliee (0 a 10, cout croissant)
    usage: /upgradehoue
    permission: farmland.gamecommands

  upgradecanne:
    description: ameliore les chances de peche multipliee (0 a 10, cout croissant)
    usage: /upgradecanne
    permission: farmland.gamecommands

  pioche:
    description: permet d'obtenir la pioche de farm
    usage: /pioche
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  shop:
    description: permet d'ouvrir le shop
    usage: /shop
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  houe:
    description: permet d'obtenir la houe du farm
    usage: /houe
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  bag:
    description: permet d'ouvrir son sac
    usage: /bag
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  hub:
    description: Retourne au hub du serveur
    usage: /hub
    aliases: [ spawn, lobby ]

  vote:
    description: Affiche les sites de vote du serveur
    usage: /vote

  psadmin:
    description: Gestion admin des joueurs (info, money, upgrade, saveall)
    usage: /psadmin
    permission: farmland.moderation
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  plotadmin:
    description: Depannage admin des plots (info, tp, border, upgrade, privacy, reload)
    usage: /plotadmin
    permission: farmland.moderation
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  tpa:
    description: Demander a se teleporter vers un joueur
    usage: /tpa <joueur>

  tpahere:
    description: Demander a un joueur de venir a soi
    usage: /tpahere <joueur>

  tpaccept:
    description: Accepter la derniere demande de teleportation
    usage: /tpaccept

  tpdeny:
    description: Refuser la derniere demande de teleportation
    usage: /tpdeny

  raceadmin:
    description: Gestion admin de la course de bateaux (holo, reset)
    usage: /raceadmin
    permission: farmland.admin
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  marketadmin:
    description: Gestion admin du marche par metier (info, holo, set, reset, recalc)
    usage: /marketadmin
    permission: farmland.moderation
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  market:
    description: Affiche l'etat actuel du marche par metier
    usage: /market

  joinboat:
    description: Démarre une course de bateau
    usage: /joinboat
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  banf:
    description: Permet de bannir les joueurs
    usage: /banf <player> <raison>
    aliases: [ ban ]
    permission: farmland.moderation
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  unbanf:
    description: Permet de débannir un joueur
    usage: /unbanf <player>
    aliases: [ unban ]
    permission: farmland.moderation
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  kickf:
    description: Permet de kick un joueur
    usage: /kickf <player> <raison>
    aliases: [ kick ]
    permission: farmland.moderation
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  warnf:
    description: Permet d'avertir un joueur
    usage: /warnf <player> <raison>
    aliases: [ warn ]
    permission: farmland.moderation
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  plot:
    description: Permet de gérer son plot
    usage: /plot home|trust|untrust|setowner
    permission: farmland.plotcommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  pay:
    description: Permet de payer un joueur
    usage: /pay <player> <montant>
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  money:
    description: Permet de voir l'argent
    usage: /money [player]
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  playerserver:
    description: Affiche les informations d'un joueur dans le serveur
    usage: /playerserver <player>
    permission: farmland.playerserver
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  saveplayer:
    description: Sauvegarde les informations de tous les joueurs
    usage: /saveplayer
    permission: farmland.saveplayer
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  msgf:
    description: Permet d'envoyer un message privé à un joueur
    usage: /msgf <joueur> <message>
    aliases: [ msg, whisper, tell, w ]
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  r:
    description: Permet de répondre au dernier message privé reçu
    usage: /r <message>
    aliases: [ reply ]
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  reportmsg:
    description: Permet de signaler un message reçu
    usage: /reportmsg <joueur>
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

  buy:
    description: Achète des options avec tes $FB
    usage: /buy <worldedit>
    permission: farmland.gamecommands
    permission-message: "Vous n'avez pas la permission d'utiliser cette commande."

permissions:
  farmland.worldedit:
    description: Donne accès complet à WorldEdit
    default: op

  farmland.worldeditbypass:
    description: Donne accès à WorldEdit et bypass toutes les restrictions
    default: op

  farmland.saveplayer:
    description: Donne accès à la commande /saveplayer
    default: op

  farmland.playerserver:
    description: Donne accès à la commande /playerserver
    default: op

  farmland.gamecommands:
    description: Donne accès aux commandes de jeu
    default: true

  farmland.moderation:
    description: Donne accès aux commandes de modération (banf, unbanf, kickf, warnf)
    default: op

  farmland.placebloc:
    description: Permet au joueur de poser et détruire des blocs (avec suivi)
    default: op

  farmland.placeblocbypass:
    description: Permet de poser/détruire des blocs sans restrictions
    default: op

  farmland.plotcommands:
    description: Permet d'utiliser les commandes de gestion de plot
    default: true

  farmland.admin:
    description: Accès aux commandes admin
    default: op

  farmland.market:
    description: Accès aux commandes du marché
    default: true

  farmland.market.admin:
    description: Accès aux commandes admin du marché (refresh)
    default: op




